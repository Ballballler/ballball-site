name: 静态导出冒烟测试

# 为什么不是「推送自动上线」：
# GitHub Pages 不运行 Python，而文章内容在 data/site.db 里（它被 .gitignore 挡着，
# 本来就不该进仓库）。在 CI 里导出只会拿到一份空的示例数据 —— 拿它上线就是拿假内容
# 覆盖真站点。所以真正的发布走本地：./deploy/pages.sh。
# 这个工作流的职责是守住「导出管线没坏」，别等要上线了才发现跑不起来。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 导出静态站
        run: python tools/export_static.py --out dist --site-url https://example.com

      - name: 校验产物
        run: |
          set -e
          for f in index.html movies.html works.html resume.html 404.html sitemap.xml robots.txt .nojekyll; do
            test -f "dist/$f" || { echo "缺少 dist/$f"; exit 1; }
          done
          # 页面必须真的内联了数据，不然静态站就是个空壳
          for f in index.html movies.html works.html resume.html; do
            grep -q "__SITE_DATA__" "dist/$f" || { echo "$f 没有内联数据"; exit 1; }
          done
          # 后台不该被当成真后台导出：这里只允许放说明页，且不能被搜索引擎收录
          test -f dist/admin.html || { echo "缺少 admin.html 说明页"; exit 1; }
          grep -q "noindex" dist/admin.html || { echo "admin.html 缺 noindex"; exit 1; }
          # 别写成 `grep -q password && exit 1`：set -e 下没匹配到也会让整步失败
          if grep -qi "type=\"password\"" dist/admin.html; then
            echo "admin.html 不该出现真正能填的口令输入框"; exit 1
          fi
          echo "产物校验通过：$(find dist -type f | wc -l) 个文件"

      - name: 上传产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: dist-smoke
          path: dist
          retention-days: 3
