<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>管理后台 · Ballball 的主页</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070b12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/orbit.css" />
  </head>
  <body>
    <!-- 全局错误条：任何脚本异常都显示在这里，避免「点了没反应」无从排查 -->
    <div class="fatal" id="fatal-bar" hidden>
      <div class="fatal__text">
        <strong>后台遇到问题</strong>
        <span id="fatal-msg"></span>
      </div>
      <div class="fatal__actions">
        <button class="btn btn--sm" type="button" id="fatal-copy">复制诊断信息</button>
        <button class="btn btn--sm" type="button" id="fatal-reload">重新加载</button>
      </div>
    </div>

    <!-- ============================ 登录 ============================ -->
    <section class="login" id="login-view" hidden>
      <form class="glass glass--strong login__card" id="login-form">
        <div class="login__title">管理后台</div>
        <p class="login__hint">输入管理口令进入。会话有效期 12 小时。</p>
        <p class="login__err" id="login-err" hidden></p>
        <div class="field">
          <label class="field__label" for="login-password">管理口令</label>
          <input
            class="input"
            id="login-password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
        </div>
        <button class="btn btn--primary" type="submit" style="width: 100%">进入后台</button>
        <p class="field__hint" style="margin-top: 14px">
          默认口令是 <code>admin12345</code>，进后台第一件事应该是改掉它。
        </p>
        <div style="margin-top: 16px; text-align: center">
          <a href="index.html" style="font-size: 0.86rem; color: var(--ink-mute)">← 返回前台</a>
        </div>
      </form>
    </section>

    <!-- ============================ 后台 ============================ -->
    <div class="admin" id="admin-view" hidden>
      <div class="admin__shell">
        <header class="glass admin__head">
          <div>
            <div class="admin__title">管理后台</div>
            <div style="font-size: 0.84rem; color: var(--ink-mute)" id="admin-sub">
              内容增删改查
            </div>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <a class="btn btn--sm" href="index.html" target="_blank" rel="noopener">预览前台 ↗</a>
            <button class="btn btn--sm" type="button" id="btn-logout">退出登录</button>
          </div>
        </header>

        <div class="admin__layout">
          <nav class="glass side" id="side-nav" aria-label="后台导航"></nav>
          <section class="glass pane" id="pane"></section>
        </div>
      </div>
    </div>

    <dialog class="modal modal--admin" id="admin-modal" aria-label="编辑">
      <div class="glass glass--strong modal__panel" id="admin-modal-panel"></div>
    </dialog>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
