# Ballball 的主页 —— nginx 反代配置
# 放到 /etc/nginx/sites-available/ballball，并把 example.com 换成你的域名

# HTTP：先只为 Certbot 的验证服务，验证完由 certbot 改写成跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 音频上限 30MB（见 MAX_AUDIO_BYTES），这里留一点余量给 multipart 开销
    client_max_body_size 32m;

    # Certbot 的 HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # 证书由 certbot 管理，首次签发前这两行会报错，先注释掉跑 HTTP 验证
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 音频上限 30MB（见 MAX_AUDIO_BYTES），这里留一点余量给 multipart 开销
    client_max_body_size 32m;

    # ---------- 静态资源直接由 nginx 出，不打扰后端 ----------
    # 注意：css/js 由后端注入 ?v=<内容哈希>（见 app/assets.py），
    # 改了文件 URL 就变，所以这里可以放心长缓存。
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|mp3|ogg|wav)$ {
        root /srv/ballball/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # 后端在这：本地没有的文件再回源
        try_files $uri @app;
    }

    # 品牌图标与分享卡不放长缓存：换了头像/名字重跑脚本之后要立刻生效
    location = /favicon.ico {
        root /srv/ballball/static;
        expires 1d;
        access_log off;
        try_files $uri @app;
    }

    location = /favicon.svg {
        root /srv/ballball/static;
        expires 1d;
        access_log off;
        try_files $uri @app;
    }

    location = /apple-touch-icon.png {
        root /srv/ballball/static;
        expires 1d;
        access_log off;
        try_files $uri @app;
    }

    location = /og-image.png {
        root /srv/ballball/static;
        expires 7d;
        access_log off;
        try_files $uri @app;
    }

    # 上传的图片与音频：文件名带随机串、可随时删，但别设 immutable
    location /uploads/ {
        root /srv/ballball/static;
        expires 7d;
        try_files $uri @app;

        # 音频走这里：必须让 Range 请求透传，否则播放器拖进度条会从头重播。
        # nginx 直出静态文件时原生支持 Range，这一段是为了反向代理回源的兜底。
        location ~* \.(mp3|wav|ogg|oga|m4a|flac|aac)$ {
            expires 7d;
            add_header Accept-Ranges bytes;
            try_files $uri @app;
        }
    }

    # ---------- SEO ----------
    location = /robots.txt {
        try_files /dev/null @app;
    }

    location = /sitemap.xml {
        try_files /dev/null @app;
    }

    # ---------- 反向代理 ----------
    location / {
        try_files /dev/null @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # 让 SSE / 长连接不被缓冲（目前没用到，留着备用）
        proxy_buffering off;
    }

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;

    # 后台别让搜索引擎收
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /dev/null @app;
    }

    access_log /var/log/nginx/ballball.access.log;
    error_log  /var/log/nginx/ballball.error.log;
}
